spring.application.name=domainify-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/domainify
spring.datasource.username=domainify
spring.datasource.password=domainify
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=DomainifySecretKey2024!@#$%^&*()_+ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefghijklmnopqrstuvwxyz
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.pre-auth-expiration=300000

# TOTP issuer shown in authenticator apps
app.totp.issuer=Domainify

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Avatar uploads (stored in DB as BYTEA; size limits still apply)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Logging
logging.level.com.domainify=DEBUG
logging.level.org.springframework.security=DEBUG
