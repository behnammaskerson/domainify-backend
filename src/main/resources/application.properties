spring.application.name=domainify-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/domainify
spring.datasource.username=domainify
spring.datasource.password=domainify
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=DomainifySecretKey2024!@#$%^&*()_+ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890abcdefghijklmnopqrstuvwxyz
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.pre-auth-expiration=300000
jwt.email-verify-expiration=86400000

# Phone verification OTP
app.phone-verify-otp-expiration-minutes=10
app.phone-verify-resend-seconds=60

# Frontend base URL for email links
app.frontend-url=http://localhost:4200

# FX rates (IraniWallet) — server-side cache; refresh ~every 10 minutes
app.currency.rates-url=https://iraniwallet.com/api/v1/rates
app.currency.cache-ttl-ms=600000
app.currency.min-fetch-gap-ms=15000

# Domain ownership verification (DNS TXT / HTTP file)
app.domain-ownership.token-ttl-hours=168
app.domain-ownership.max-check-attempts=20
app.domain-ownership.check-cooldown-seconds=15

# Registrar expiry lookup (RDAP / IANA bootstrap)
app.domain.rdap.bootstrap-url=https://data.iana.org/rdap/dns.json

# Domain renewal reminders — defaults used when seeding domain_settings (admin Settings can override)
app.domain.renewal.windows=90,60,30
app.domain.renewal.send-hour=9
app.domain.renewal.send-minute=0
# Minute tick; actual send time comes from domain_settings
app.domain.renewal.check-cron=0 * * * * *

# Marketplace offer expiry (idle PENDING/COUNTERED offers)
app.marketplace.offer.expiry-enabled=true
app.marketplace.offer.expiry-days=7
# Hourly check
app.marketplace.offer.expiry-check-cron=0 0 * * * *

# TOTP issuer shown in authenticator apps
app.totp.issuer=Domainify

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Avatar uploads (stored in DB as BYTEA; size limits still apply)
# Ticket attachments: per-file / per-request caps (admin settings may be lower)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=260MB

# Logging
logging.level.com.domainify=DEBUG
logging.level.org.springframework.security=DEBUG
